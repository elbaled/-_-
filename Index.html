<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إلى دنيا محمد 🌹</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 50% 20%, #4b164c, #16091d 60%, #050509);
  color: white;
  text-align: center;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.container {
  position: relative;
  z-index: 5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

h1 {
  font-size: 38px;
  margin: 0 0 8px;
  text-shadow: 0 0 15px #ff4f91;
  animation: glow 2s infinite alternate;
}

.subtitle {
  font-size: 18px;
  margin-bottom: 15px;
  opacity: .9;
}

/* الوردة */
.flower {
  position: relative;
  width: 220px;
  height: 280px;
  margin: 5px auto;
}

.stem {
  position: absolute;
  width: 9px;
  height: 155px;
  background: linear-gradient(#55c878, #176b36);
  left: 105px;
  bottom: 0;
  border-radius: 10px;
}

.leaf {
  position: absolute;
  width: 80px;
  height: 38px;
  background: linear-gradient(135deg, #55d477, #18833e);
  border-radius: 100% 0;
}

.leaf.left {
  left: 35px;
  bottom: 65px;
  transform: rotate(25deg);
}

.leaf.right {
  right: 30px;
  bottom: 100px;
  transform: rotate(-25deg);
  border-radius: 0 100%;
}

/* الورد */
.rose {
  position: absolute;
  width: 145px;
  height: 145px;
  top: 15px;
  left: 38px;
  animation: roseMove 3s infinite alternate ease-in-out;
}

.petal {
  position: absolute;
  width: 82px;
  height: 82px;
  background: radial-gradient(
    circle at 35% 30%,
    #ffb3cb,
    #ff4d88 45%,
    #c91559 100%
  );
  border-radius: 55% 55% 45% 45%;
  box-shadow: 0 0 18px rgba(255, 70, 140, .7);
}

.p1 {
  top: 0;
  left: 31px;
}

.p2 {
  top: 28px;
  left: 0;
  transform: rotate(-35deg);
}

.p3 {
  top: 28px;
  right: 0;
  transform: rotate(35deg);
}

.p4 {
  bottom: 0;
  left: 31px;
}

.center {
  position: absolute;
  width: 60px;
  height: 60px;
  left: 43px;
  top: 43px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #ffd0df, #ff4f91 50%, #a90046);
  box-shadow: 0 0 20px #ff4d88;
  z-index: 10;
}

/* الزر */
button {
  margin-top: 5px;
  border: none;
  padding: 15px 32px;
  border-radius: 35px;
  background: linear-gradient(45deg, #e91e63, #ff4f91);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(255, 50, 130, .5);
  transition: .3s;
}

button:hover {
  transform: scale(1.08);
}

/* الرسالة */
#message {
  max-width: 500px;
  margin-top: 22px;
  font-size: 21px;
  line-height: 1.9;
  opacity: 0;
  transform: translateY(15px);
  transition: 1s;
  text-shadow: 0 0 10px #ff6b9d;
}

#message.show {
  opacity: 1;
  transform: translateY(0);
}

/* قلوب */
.heart {
  position: fixed;
  bottom: -50px;
  font-size: 22px;
  z-index: 3;
  animation: heartFloat linear infinite;
  pointer-events: none;
}

@keyframes roseMove {
  from {
    transform: scale(.9) rotate(-4deg);
  }

  to {
    transform: scale(1.08) rotate(4deg);
  }
}

@keyframes glow {
  from {
    text-shadow: 0 0 8px #ff4f91;
  }

  to {
    text-shadow:
      0 0 10px #fff,
      0 0 25px #ff4f91,
      0 0 45px #ff4f91;
  }
}

@keyframes heartFloat {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }

  15% {
    opacity: .8;
  }

  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">

  <h1>🌹 دنيا محمد 🌹</h1>

  <div class="subtitle">
    وردة مخصوص علشانك ❤️
  </div>

  <div class="flower">

    <div class="stem"></div>

    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="rose">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="center"></div>
    </div>

  </div>

  <button onclick="openMessage()">
    🎁 افتحي المفاجأة
  </button>

  <div id="message">
    🌹 إلى دنيا محمد 🌹<br>
    أتمنى تفضلي دايمًا مبتسمة ❤️<br>
    ودي وردة بسيطة مخصوص علشانك 🌸<br>
    ✨ أتمنى أيامك كلها تكون جميلة ✨
  </div>

</div>

<script>

/* =========================
   القلوب المتحركة
========================= */

for (let i = 0; i < 25; i++) {

  const heart = document.createElement("div");

  heart.className = "heart";
  heart.innerHTML = Math.random() > .5 ? "❤️" : "💕";

  heart.style.left = Math.random() * 100 + "vw";

  heart.style.animationDuration =
    (5 + Math.random() * 7) + "s";

  heart.style.animationDelay =
    Math.random() * 7 + "s";

  document.body.appendChild(heart);
}


/* =========================
   الرسالة
========================= */

function openMessage() {

  document.getElementById("message")
    .classList.add("show");

  // ألعاب نارية احتفالية على الشاشة
  for (let i = 0; i < 8; i++) {

    setTimeout(() => {

      createFirework(
        Math.random() * canvas.width,
        Math.random() * canvas.height * .55
      );

    }, i * 350);
  }
}


/* =========================
   الألعاب النارية
========================= */

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let fireworks = [];

function resizeCanvas() {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


function createFirework(x, y) {

  const colors = [
    "#ff4d88",
    "#ffd166",
    "#7df9ff",
    "#c77dff",
    "#ffffff"
  ];

  const color =
    colors[Math.floor(Math.random() * colors.length)];

  for (let i = 0; i < 70; i++) {

    const angle =
      Math.PI * 2 * i / 70;

    const speed =
      2 + Math.random() * 5;

    fireworks.push({

      x: x,
      y: y,

      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,

      life: 80 + Math.random() * 30,

      color: color

    });

  }
}


function animateFireworks() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  fireworks =
    fireworks.filter(p => p.life > 0);

  fireworks.forEach(p => {

    p.x += p.vx;
    p.y += p.vy;

    p.vy += .035;

    p.life--;

    ctx.globalAlpha =
      p.life / 100;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      2,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = p.color;

    ctx.shadowBlur = 15;
    ctx.shadowColor = p.color;

    ctx.fill();

  });

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  requestAnimationFrame(animateFireworks);
}

animateFireworks();


/* ألعاب نارية صغيرة تلقائيًا */

setInterval(() => {

  createFirework(
    Math.random() * canvas.width,
    100 + Math.random() * 250
  );

}, 2500);

</script>

</body>
</html>
